<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Management System (Cloud Edition)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f9f9f9; color: #333; }
        h2 { text-align: center; margin-bottom: 5px; }
        .sync-status { text-align: center; font-size: 14px; font-weight: bold; color: #d35400; min-height: 20px; margin-bottom: 15px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-section, .filter-section, .import-section { display: flex; gap: 10px; margin-bottom: 20px; padding: 15px; background: #f1f5f9; border-radius: 5px; flex-wrap: wrap; align-items: center; }
        .import-section { background: #e2e8f0; border: 1px dashed #cbd5e1; }
        input, select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input:not([type="file"]) { flex: 1; min-width: 140px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; white-space: nowrap; }
        button:hover { background-color: #0056b3; }
        button.delete-btn { background-color: #dc3545; }
        button.delete-btn:hover { background-color: #a71d2a; }
        button.edit-btn { background-color: #ffc107; color: black; }
        button.edit-btn:hover { background-color: #d39e00; }
        button.import-btn { background-color: #28a745; }
        button.import-btn:hover { background-color: #218838; }
        button.export-btn { background-color: #17a2b8; }
        button.export-btn:hover { background-color: #138496; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:hover:not(.date-header) { background-color: #f1f1f1; }
        .date-header { background-color: #e2e8f0; font-weight: bold; color: #1e293b; font-size: 15px; border-top: 2px solid #cbd5e1; }
        .date-header td { padding: 10px 15px; }
        .highlight { background-color: #fff3cd !important; transition: background-color 0.5s ease; }
    </style>
</head>
<body>

<div class="container">
    <h2>Record Management System</h2>
    
    <div id="syncStatus" class="sync-status"></div>

    <div class="import-section">
        <strong>Data Options:</strong>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
        <button class="import-btn" onclick="importExcel()" id="importBtn">Import Excel</button>
        <button class="export-btn" onclick="exportExcel()">Export to Excel</button>
    </div>

    <!-- Input Form WITH Suggestions Links -->
    <form class="form-section" id="recordForm">
        <input type="number" id="numInput" placeholder="Enter Number" required>
        
        <!-- Rep Name Input + Datalist -->
        <input type="text" id="repInput" placeholder="Enter Rep Name" required list="repSuggestions" autocomplete="off">
        <datalist id="repSuggestions"></datalist>

        <!-- Reason Input + Datalist -->
        <input type="text" id="reasonInput" placeholder="Enter Reason" required list="reasonSuggestions" autocomplete="off">
        <datalist id="reasonSuggestions"></datalist>

        <button type="submit" id="submitBtn">Add Record</button>
        <button type="button" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
    </form>

    <div class="filter-section">
        <strong>Search & Filter:</strong>
        <input type="number" id="searchNum" placeholder="Search by Number..." onkeyup="renderTable()">
        <select id="filterRep" onchange="renderTable()">
            <option value="">All Rep Names</option>
        </select>
        <select id="filterReason" onchange="renderTable()">
            <option value="">All Reasons</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Number</th>
                <th>Rep Name</th>
                <th>Reason</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" style="text-align:center;">Loading data from cloud... Please wait.</td></tr>
        </tbody>
    </table>
</div>

<script>
    // --- YOUR CONNECTED GOOGLE SCRIPT URL ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4uwjSxZzYrVZjNglumyw1KFvFWRqR6WG8DlRxEkPI6BZ1CeZU3v1NkWk3SyB242rMyg/exec';
    
    let records = [];
    let editingId = null;

    const form = document.getElementById('recordForm');
    const numInput = document.getElementById('numInput');
    const repInput = document.getElementById('repInput');
    const reasonInput = document.getElementById('reasonInput');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const syncStatus = document.getElementById('syncStatus');

    function showLoading(message) { syncStatus.innerHTML = `⏳ ${message}`; }
    function hideLoading() { syncStatus.innerHTML = ``; }

    async function syncToCloud(action, recordData) {
        showLoading(action === 'BULK_ADD' ? "Uploading batch to Database..." : "Syncing with Database...");
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: action, record: recordData })
            });
        } catch (error) {
            console.error('Error syncing:', error);
        }
        hideLoading();
    }

    async function loadData() {
        showLoading("Downloading records from Cloud...");
        try {
            const response = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const textData = await response.text();
            
            if (textData.includes("<!DOCTYPE html>") || textData.includes("<html")) {
                throw new Error("PERMISSION_DENIED");
            }

            const data = JSON.parse(textData);
            
            records = data.map(row => {
                const keys = Object.keys(row);
                const findKey = (searchWord) => keys.find(k => k.toLowerCase().includes(searchWord.toLowerCase()));
                
                const numKey = findKey('num');
                const repKey = findKey('rep') || findKey('name');
                const reasonKey = findKey('reason');
                const dateKey = findKey('date');
                const idKey = findKey('id');

                return {
                    id: idKey && row[idKey] ? String(row[idKey]) : (Date.now().toString() + Math.random().toString(36).substr(2, 5)),
                    number: numKey && row[numKey] ? String(row[numKey]).trim() : "",
                    rep: repKey && row[repKey] ? String(row[repKey]).trim() : "",
                    reason: reasonKey && row[reasonKey] ? String(row[reasonKey]).trim() : "",
                    enteredDate: dateKey && row[dateKey] ? row[dateKey] : getLocalDateString()
                };
            }).filter(r => r.number !== ""); 

            updateFilters();
            renderTable();
        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="text-align:center;">Failed to load data. Please refresh the page.</td></tr>`;
        }
        hideLoading();
    }

    function getLocalDateString() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        if (typeof dateString === 'string' && dateString.includes('T')) {
            dateString = dateString.split('T')[0]; 
        }
        const parts = String(dateString).split('-');
        if (parts.length === 3) {
            const date = new Date(parts[0], parts[1] - 1, parseInt(parts[2]));
            return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        }
        let d = new Date(dateString);
        if(!isNaN(d)) {
             return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        }
        return String(dateString);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const num = numInput.value.trim();
        const rep = repInput.value.trim();
        const reason = reasonInput.value.trim();

        const duplicateRecord = records.find(r => r.number === num && r.id !== editingId);
        if (duplicateRecord) {
            alert(`Number ${num} has already been entered! Redirecting to the record.`);
            document.getElementById('searchNum').value = num;
            document.getElementById('filterRep').value = "";
            document.getElementById('filterReason').value = "";
            renderTable(num);
            cancelEdit();
            return;
        }

        if (editingId) {
            const recordIndex = records.findIndex(r => r.id === editingId);
            if(recordIndex !== -1) {
                records[recordIndex].number = num;
                records[recordIndex].rep = rep;
                records[recordIndex].reason = reason;
                syncToCloud('EDIT', records[recordIndex]);
            }
            editingId = null;
            submitBtn.textContent = "Add Record";
            cancelBtn.style.display = "none";
        } else {
            const newRecord = { 
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                number: num, 
                rep: rep, 
                reason: reason,
                enteredDate: getLocalDateString()
            };
            records.push(newRecord);
            syncToCloud('ADD', newRecord);
        }

        form.reset();
        updateFilters();
        renderTable();
    });

    // --- BULK SMART EXCEL IMPORTER ---
    function importExcel() {
        const fileInput = document.getElementById('excelFile');
        const file = fileInput.files[0];
        if (!file) { alert("Please select an Excel file first."); return; }

        const reader = new FileReader();
        reader.onload = async function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            if(rawRows.length < 2) {
                alert("Excel sheet appears to be empty.");
                return;
            }

            let headers = rawRows[0].map(h => String(h).toLowerCase());
            
            let numIdx = headers.findIndex(h => h.includes('num'));
            let repIdx = headers.findIndex(h => h.includes('rep') || h.includes('name'));
            let reasonIdx = headers.findIndex(h => h.includes('reason'));
            let dateIdx = headers.findIndex(h => h.includes('date') || h.includes('time'));
            
            if(numIdx === -1) numIdx = 0; 
            if(repIdx === -1) repIdx = 1; 
            if(reasonIdx === -1) reasonIdx = 2; 
            if(dateIdx === -1) dateIdx = 3; 

            let skipCount = 0;
            let recordsToAdd = [];

            for(let i = 1; i < rawRows.length; i++) {
                let row = rawRows[i];
                if (!row || row.length === 0) continue; 

                let num = row[numIdx];
                let rep = row[repIdx] || "";
                let reason = row[reasonIdx] || "";
                let rawDate = row[dateIdx];

                if (num !== undefined && num !== null && String(num).trim() !== '') {
                    const strNum = String(num).trim();
                    
                    if (records.some(r => r.number === strNum) || recordsToAdd.some(r => r.number === strNum)) {
                        skipCount++;
                        continue;
                    }

                    let finalDate = getLocalDateString();
                    if (rawDate) {
                        if (rawDate instanceof Date) {
                            const yyyy = rawDate.getUTCFullYear();
                            const mm = String(rawDate.getUTCMonth() + 1).padStart(2, '0');
                            const dd = String(rawDate.getUTCDate()).padStart(2, '0');
                            finalDate = `${yyyy}-${mm}-${dd}`;
                        } else {
                            let d = new Date(rawDate);
                            if (!isNaN(d)) {
                                const yyyy = d.getFullYear();
                                const mm = String(d.getMonth() + 1).padStart(2, '0');
                                const dd = String(d.getDate()).padStart(2, '0');
                                finalDate = `${yyyy}-${mm}-${dd}`;
                            }
                        }
                    }

                    recordsToAdd.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        number: strNum,
                        rep: String(rep).trim(),
                        reason: String(reason).trim(),
                        enteredDate: finalDate
                    });
                }
            }

            if(recordsToAdd.length > 0) {
                recordsToAdd.forEach(r => records.push(r));
                updateFilters();
                renderTable();
                
                await syncToCloud('BULK_ADD', recordsToAdd);
                
                alert(`Import Complete!\nSuccessfully added and synced: ${recordsToAdd.length} records.\nSkipped duplicates: ${skipCount}`);
            } else {
                alert(`Import Finished. 0 new records added.\nSkipped duplicates/blank rows: ${skipCount}`);
            }
            fileInput.value = ""; 
        };
        reader.readAsArrayBuffer(file);
    }

    function exportExcel() {
        if (records.length === 0) { alert("No records to export!"); return; }
        const exportData = records.map(record => ({
            "Number": record.number,
            "Rep Name": record.rep,
            "Reason": record.reason,
            "Entered Date": record.enteredDate 
        }));
        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Records Data");
        XLSX.writeFile(workbook, "System_Records_Export.xlsx");
    }

    function renderTable(highlightNum = null) {
        const tableBody = document.getElementById('tableBody');
        const searchNum = document.getElementById('searchNum').value;
        const filterRep = document.getElementById('filterRep').value;
        const filterReason = document.getElementById('filterReason').value;
        tableBody.innerHTML = "";
        
        records.sort((a, b) => new Date(b.enteredDate) - new Date(a.enteredDate));
        let currentCategoryDate = null;

        records.forEach((record) => {
            if (searchNum && !record.number.includes(searchNum)) return;
            if (filterRep && record.rep !== filterRep) return;
            if (filterReason && record.reason !== filterReason) return;

            const formattedDate = formatDate(record.enteredDate);
            if (formattedDate !== currentCategoryDate) {
                currentCategoryDate = formattedDate;
                const dateHeaderRow = document.createElement('tr');
                dateHeaderRow.classList.add('date-header');
                dateHeaderRow.innerHTML = `<td colspan="4">📅 ${formattedDate}</td>`;
                tableBody.appendChild(dateHeaderRow);
            }

            const tr = document.createElement('tr');
            if (highlightNum === record.number) { tr.classList.add('highlight'); }
            tr.innerHTML = `
                <td><strong>${record.number}</strong></td>
                <td>${record.rep}</td>
                <td>${record.reason}</td>
                <td>
                    <button class="edit-btn" onclick="editRecord('${record.id}')">Edit</button>
                    <button class="delete-btn" onclick="deleteRecord('${record.id}')">Delete</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });

        if(records.length > 0 && tableBody.innerHTML === "") {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No matching records found.</td></tr>`;
        } else if (records.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No records exist yet. Try adding one!</td></tr>`;
        }
    }

    function editRecord(id) {
        const record = records.find(r => r.id === id);
        if(!record) return;
        editingId = record.id;
        numInput.value = record.number;
        repInput.value = record.rep;
        reasonInput.value = record.reason;
        submitBtn.textContent = "Update Record";
        cancelBtn.style.display = "inline-block";
        window.scrollTo(0, 0);
    }

    function cancelEdit() {
        editingId = null;
        form.reset();
        submitBtn.textContent = "Add Record";
        cancelBtn.style.display = "none";
    }

    function deleteRecord(id) {
        if(confirm("Are you sure you want to delete this record?")) {
            records = records.filter(r => r.id !== id);
            syncToCloud('DELETE', { id: id });
            updateFilters();
            renderTable();
            if(editingId === id) cancelEdit();
        }
    }

    function updateFilters() {
        const repFilter = document.getElementById('filterRep');
        const reasonFilter = document.getElementById('filterReason');
        
        // Grab datalists for text suggestions
        const repDatalist = document.getElementById('repSuggestions');
        const reasonDatalist = document.getElementById('reasonSuggestions');

        const currentRep = repFilter.value;
        const currentReason = reasonFilter.value;
        
        // Extract unique Rep Names and Reasons from all saved records
        const reps = [...new Set(records.map(r => r.rep).filter(r => r !== ""))];
        const reasons = [...new Set(records.map(r => r.reason).filter(r => r !== ""))];
        
        // --- Populate the search dropdown filters ---
        repFilter.innerHTML = '<option value="">All Rep Names</option>';
        reps.forEach(rep => repFilter.innerHTML += `<option value="${rep}">${rep}</option>`);
        
        reasonFilter.innerHTML = '<option value="">All Reasons</option>';
        reasons.forEach(reason => reasonFilter.innerHTML += `<option value="${reason}">${reason}</option>`);
        
        // --- Populate the input text box suggestions ---
        repDatalist.innerHTML = '';
        reps.forEach(rep => repDatalist.innerHTML += `<option value="${rep}">`);
        
        reasonDatalist.innerHTML = '';
        reasons.forEach(reason => reasonDatalist.innerHTML += `<option value="${reason}">`);

        if(reps.includes(currentRep)) repFilter.value = currentRep;
        if(reasons.includes(currentReason)) reasonFilter.value = currentReason;
    }

    loadData();

</script>

</body>
</html>
